name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: codeberg-small
    container:
      image: node:lts-slim
    defaults:
      run:
        shell: sh

    steps:
      - name: Install CI prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
          rm -rf /var/lib/apt/lists/*
          install -d -m 0755 /nix
          mkdir -p /etc/nix
          printf '%s\n' 'build-users-group =' 'experimental-features = nix-command flakes' > /etc/nix/nix.conf
          curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install | sh -s -- --no-daemon
          ln -sf /root/.nix-profile/bin/nix /usr/local/bin/nix

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check tag matches package version
        run: |
          nix develop path:$PWD --command node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tagName = process.env.GITHUB_REF_NAME ?? process.env.GITHUB_REF?.replace(/^refs\/tags\//, "");
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            const expectedTag = `v${version}`;
            if (tagName !== expectedTag) {
              console.error("Tag must match package.json version.");
              console.error(`Tag:      ${tagName ?? "<missing>"}`);
              console.error(`Expected: ${expectedTag}`);
              process.exit(1);
            }
          '

      - name: Run checks
        run: nix flake check path:$PWD

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          nix develop path:$PWD --command sh -c '
            if [ -z "$NPM_TOKEN" ]; then
              echo "NPM_TOKEN secret is required."
              exit 1
            fi

            PKG="$(node -p "require(\"./package.json\").name")"
            VERSION="$(node -p "require(\"./package.json\").version")"

            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is already published; skipping npm publish."
            else
              echo "Publishing $PKG@$VERSION."
              printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
              corepack pnpm publish --access public --no-git-checks
            fi
          '

      - name: Create Codeberg release
        env:
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_REF_NAME: ${{ github.ref_name }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: nix develop path:$PWD --command node scripts/create-forgejo-release.mjs
